}
function viewCompany(){
 const items=OFFERS.filter(o=>o.company===state.company);
 const cards=items.map(o=>`<button class="choice" data-action="select-offer" data-value="${E(o.id)}"><span><strong>${E(o.zone)} · ${E(o.role)}</strong><small>${E(o.schedule)} · ${E(o.hours)}${o.status==='proximamente'?' · PRÓXIMAMENTE':''}</small></span><span class="arrow">→</span></button>`).join('');
 return `${breadcrumb('Elegir centro')}<span class="kicker">PASO 2 · EMPRESA SELECCIONADA</span><h1>${E(state.company)}<br><em>Elige la oferta principal.</em></h1><p class="lede">Selecciona el centro o turno donde quieres presentar candidatos. Si no encaja, el derivador buscará otras opciones dentro de ${E(CITY)}.</p><div class="choice-grid">${cards}</div>`;
}
function feature(o){const warn=o.status!=='informada' ? `<div class="callout">${o.status==='proximamente'?'Esta empresa figura como «próximamente» en el Excel. No es una vacante confirmada.':'Parte de esta ficha necesita confirmación con la empresa.'}</div>`:'';
return `<article class="feature"><div class="feature-top"><div><span class="kicker">OFERTA DE PARTIDA</span><h2>${E(o.company)} · ${E(o.zone)}</h2><p class="tiny">${E(o.role)} ${o.code?'· Centro '+E(o.code):''}</p></div>${status(o)}</div><div class="stats"><div class="stat"><span class="title">Horario</span><b>${E(o.schedule)}</b></div><div class="stat"><span class="title">Jornada</span><b>${E(o.hours)}</b></div><div class="stat"><span class="title">Salario</span><b>${E(o.salary)}</b></div><div class="stat"><span class="title">Carné</span><b>${E(o.license)}</b></div></div><div class="info-line"><span><b>Condiciones:</b> ${E(reqs(o).join(' · ')||'Pendientes de confirmar')}</span></div>${detail(o)}${warn}</article>`}
function viewOffer(){const o=chosen();return `${breadcrumb('Oferta principal')}<span class="kicker">TU OFERTA ACTUAL · ${E(CITY).toUpperCase()}</span><h1>¿Encaja este <em>candidato?</em></h1><p class="lede">Comprueba las condiciones de la oferta. Si no puede trabajar aquí, indica el motivo y te mostraremos alternativas concretas.</p>${feature(o)}<h2 class="section-title">Si no encaja, ¿cuál es el motivo?</h2><div class="reason-grid">${reasonOptions.map(([id,no,title,sub])=>`<button class="reason-card" data-action="reason" data-value="${id}"><span class="reason-number">${no}</span><strong>${title}</strong><small>${E(sub)}</small><span class="arrow">→</span></button>`).join('')}</div><p class="fine">El botón «Volver» permite cambiar de centro; «Cambiar empresa» devuelve al inicio.</p>`}
const hChoices=[['manana','Solo de mañana','Buscar turnos de mañana explícitos.'],['tarde','Solo de tarde','Buscar turnos de tarde explícitos.'],['parcial','Necesito jornada parcial','Priorizar contratos por debajo de la jornada completa.'],['flexible','Necesito un turno flexible','Solo ofertas donde se indica flexibilidad.'],['no-finde','No puedo trabajar fines de semana','Comprobar si hay alguna oferta compatible.']];
const cChoices=[['moto','Tengo permiso de moto (AM / A), pero no B','Mostrar puestos de moto, si existen.'],['andarin','No tengo ningún permiso','Mostrar ofertas de andarín, sujetas a confirmar requisitos.'],['b-reciente','Tengo B pero con poca antigüedad','Mostrar ofertas que admiten un carné reciente.']];
function answerChoices(){return state.reason==='horario'?hChoices:state.reason==='carnet'?cChoices:zones.map(z=>[z,z,z.includes('(sin datos)')?'No hay centros documentados en esa zona.':`Centros registrados en ${z}.`]);}
function viewQuestion(){const data={horario:['Horario','¿Qué horario necesita el candidato?','Mostraré solo franjas publicadas expresamente como compatibles.'],carnet:['Carné','¿Qué permiso tiene realmente?','No consideraré reparto en moto si falta el permiso correspondiente.'],zona:['Zona','¿Qué zona le viene mejor?','Mostraremos ofertas de la zona elegida, sin inventar distancias.']}[state.reason];return `${breadcrumb(data[0])}<span class="kicker">DERIVACIÓN · ${E(data[0]).toUpperCase()}</span><h1>${E(data[1]).replace(/\?$/,'')}<em>?</em></h1><p class="lede">${E(data[2])}</p><div class="choice-grid">${answerChoices().map(([v,title,desc])=>`<button class="choice" data-action="answer" data-value="${E(v)}"><span><strong>${E(title)}</strong><small>${E(desc)}</small></span><span class="arrow">→</span></button>`).join('')}</div>`}
function recommend(){const main=chosen();const input=state.answer;let scored=[];
 for(const o of OFFERS){if(o.id===main.id||!active(o))continue;let score=0,why='';
 if(state.reason==='zona'){
   if(o.zone!==input)continue;score=200;why=`Centro situado en ${o.zone}.`;
 }else if(state.reason==='horario'){
   if(input==='no-finde')continue;
   if(!o.tags.includes(input))continue;
   score=180+(o.tags.includes('flexible')?4:0);why= input==='manana'?'Tiene turno de mañana indicado en el Excel.':input==='tarde'?'Tiene turno de tarde indicado en el Excel.':input==='parcial'?'La ficha incluye jornada parcial.':'La ficha permite negociar un horario flexible.';
 }else if(state.reason==='carnet'){
   if(input==='moto'){if(o.mode!=='moto')continue;score=220;why='Reparto en moto: requiere permiso AM / A / B y la antigüedad indicada.';}
   if(input==='andarin'){if(o.mode!=='walk')continue;score=210;why='Modalidad andando; confirmar si admite candidatos sin carné.';}
   if(input==='b-reciente'){if(o.mode!=='van'||o.minYears==null||o.minYears>0.25)continue;score=210;why='La ficha admite un carné B con al menos dos meses de antigüedad.';}
 }
 if(o.company===main.company)score+=7;
 if(o.status==='verificar')score-=15;
 scored.push({o,score,why});
 }
 scored.sort((a,b)=>b.score-a.score||a.o.company.localeCompare(b.o.company,'es')||a.o.zone.localeCompare(b.o.zone,'es'));
 return scored;
}
const answerTitle=()=> (answerChoices().find(a=>a[0]===state.answer)||[])[1]||state.answer;
function resultCard(row,i){const o=row.o;return `<article class="result"><div class="result-top"><div><span class="result-label">${i===0?'PRIMERA ALTERNATIVA':'ALTERNATIVA '+(i+1)}</span><h3>${E(o.company)} · ${E(o.zone)}</h3><div class="subtitle">${E(o.role)} ${o.code?'· Centro '+E(o.code):''}</div></div>${status(o)}</div><p class="match">✓ ${E(row.why)}</p><div class="result-meta"><div><span>Horario</span><b>${E(o.schedule)}</b></div><div><span>Jornada</span><b>${E(o.hours)}</b></div><div><span>Salario</span><b>${E(o.salary)}</b></div><div><span>Permiso</span><b>${E(reqs(o)[0]||o.license)}</b></div></div>${o.status==='verificar'?'<p class="note">⚠ Esta oferta requiere confirmar algunas condiciones.</p>':''}${detail(o)}</article>`}
function viewResults(){const matches=recommend();const count=matches.length;let alert='';
 if(state.reason==='carnet'&&state.answer==='moto'&&count===0)alert='No hay ofertas de moto documentadas en este Excel para esta ciudad.';
 else if(state.reason==='horario'&&state.answer==='no-finde')alert='En las fichas disponibles se pide disponibilidad de lunes a domingo con descansos rotativos. No hay alternativa confirmada sin fines de semana.';
 else if(state.reason==='carnet'&&state.answer==='andarin'&&count>0)alert='El reparto andando existe en las fichas, pero el documento mezcla sus requisitos con los de furgoneta. Confirma específicamente si permite trabajar sin carné.';
 else if(count===0)alert='No hay una alternativa que cumpla ese criterio en los datos disponibles para esta ciudad.';
 return `${breadcrumb('Alternativas')}<span class="kicker">RESULTADO PARA ${E(CITY).toUpperCase()}</span><h1>${count?`${count} ${count===1?'alternativa':'alternativas'} para <em>derivar.</em>`:'No hay una opción <em>confirmada.</em>'}</h1><p class="lede">Oferta de partida: <strong style="color:#fff">${E(chosen().company)} · ${E(chosen().zone)}</strong> · Motivo: <strong style="color:#fff">${E(answerTitle())}</strong>.</p>${alert?`<div class="callout">${E(alert)}</div>`:''}${count?`<div class="result-list">${matches.map(resultCard).join('')}</div>`:`<div class="empty"><strong>Sin coincidencias comprobadas.</strong><p>Prueba otro turno, zona o modalidad. No se mostrarán ofertas incompatibles solo para completar resultados.</p></div>`}<div class="toolbar"><button class="btn-red" data-action="back">← Cambiar respuesta</button><button class="btn-simple" data-action="offer">Volver a la oferta</button><button class="btn-simple" data-action="home">Cambiar empresa</button></div><p class="fine">Guía de orientación con datos facilitados en los Excel. Es necesario verificar disponibilidad, documentación y requisitos antes de derivar. No confirma vacantes en tiempo real.</p>`}
function render(){app.innerHTML=state.page==='home'?viewHome():state.page==='company'?viewCompany():state.page==='offer'?viewOffer():state.page==='question'?viewQuestion():viewResults();document.getElementById('backTop').hidden=historyStack.length===0;document.title=(state.page==='home'?CITY:(state.company||CITY))+' · Derivador de reparto';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,val=b.dataset.value;
 if(a==='home')return home();if(a==='back')return back();
 if(a==='company')return navigate('company',{job:null,reason:null,answer:null});
 if(a==='offer')return navigate('offer',{reason:null,answer:null});
 if(a==='select-company'){const list=OFFERS.filter(o=>o.company===val);return list.length===1?navigate('offer',{company:val,job:list[0].id,reason:null,answer:null}):navigate('company',{company:val,job:null,reason:null,answer:null});}
 if(a==='select-offer')return navigate('offer',{job:val,reason:null,answer:null});
 if(a==='reason')return navigate('question',{reason:val,answer:null});
 if(a==='answer')return navigate('results',{answer:val});
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&historyStack.length)back()});
document.getElementById('backTop').addEventListener('click',back);
render();
</script></body></html>
